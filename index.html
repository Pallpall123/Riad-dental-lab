  #app{max-width:1200px;margin:0 auto;padding:16px 16px calc(88px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:42px;height:42px;border-radius:11px;background:#F7EEDD;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #EAD8B4;object-fit:cover}.brand-mark svg{width:42px;height:42px}.brand-text h1{font-size:17px;font-weight:800;margin:0;line-height:1.2;letter-spacing:.3px}.brand-text span{font-size:11.5px;color:var(--muted)}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:500;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(122,21,25,.08)}
  .nav-toggle-btn{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom));left:14px;z-index:501;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(122,21,25,.3);cursor:pointer}
  .nav-toggle-btn svg{width:18px;height:18px}
  body.nav-hidden .bottom-nav{display:none}
  body.nav-hidden .nav-toggle-btn{bottom:calc(14px + env(safe-area-inset-bottom))}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;color:var(--muted);padding:6px 2px;border-radius:9px;font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer}.nav-btn svg{width:20px;height:20px}.nav-btn.active{color:var(--brand)}.nav-btn.active .nav-icon-wrap{background:var(--brand-tint)}.nav-icon-wrap{width:38px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}.panel-head h2{font-size:16px;font-weight:800;margin:0}.panel-head .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s}.btn svg{width:15px;height:15px;flex-shrink:0}.btn:hover{border-color:var(--brand);color:var(--brand-dark)}.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}.btn-danger{color:var(--danger);border-color:var(--danger-tint)}.btn-danger:hover{background:var(--danger-tint);border-color:var(--danger)}.btn-ghost{border-color:transparent;background:transparent}.btn-ghost:hover{background:var(--line-2)}.btn-sm{padding:6px 10px;font-size:12.5px}.btn-icon{padding:8px}.btn:disabled{opacity:.4;cursor:not-allowed}
  .field-row{display:flex;gap:8px;align-items:flex-end}.field-row .field{flex:1}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12.5px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);width:100%;transition:.15s}.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);background:#fff}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}@media(max-width:720px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}thead th{background:var(--brand-tint);color:var(--brand-dark);font-weight:800;padding:9px 10px;text-align:right;border:1.5px solid #D9B3AE;font-size:12px;white-space:nowrap}tbody td{padding:8px 10px;border:1.5px solid #D9B3AE;vertical-align:middle}tbody tr:hover{background:var(--panel-2)}tbody td select,tbody td input{font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}.search-case-card{border:1px solid var(--line);border-radius:9px;margin-bottom:14px;overflow:hidden}.search-case-card:last-child{margin-bottom:0}.search-case-head{padding:8px 12px;background:var(--panel-2);font-size:12.5px;font-weight:700;border-bottom:1px solid var(--line)}.search-case-card table{margin:0}.search-case-card th,.search-case-card td{border:1.5px solid #D9B3AE}.case-total-line{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--panel-2);font-size:12.5px;border-top:1px solid var(--line)}.case-total-line b{font-size:14px;font-weight:800}.empty-row td{text-align:center;color:var(--muted);padding:26px 10px;font-size:13px}
  .totals-bar{display:flex;gap:10px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:14px;margin-top:12px}.total-chip{flex:1;min-width:120px}.total-chip .l{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:3px}.total-chip .v{font-size:17px;font-weight:800}.total-chip.due .v{color:var(--danger)}.total-chip.paid .v{color:var(--ok)}
  .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}.badge.due{background:var(--danger-tint);color:var(--danger)}.badge.settled{background:var(--ok-tint);color:var(--ok)}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-width:320px}.search-box svg{width:15px;height:15px;stroke:var(--muted);flex-shrink:0}.search-box input{border:none;background:transparent;font-family:inherit;font-size:13.5px;width:100%;outline:none}

function openExport(printNow){const doctorId=state.reportFilters.doctorId;if(!doctorId){toast('اختر الطبيب أولًا');return}if(state.settings.carryoverMode==='manual'){const v=prompt('أدخل الرصيد المرحّل من الفواتير السابقة لهذا الطبيب (اكتب 0 إذا لا يوجد)','0');if(v===null)return;state.reportFilters.openingBalance=Number(v)||0}else{state.reportFilters.openingBalance=autoOpeningBalance(doctorId,state.reportFilters.from)}const w=window.open('','_blank');if(!w){toast('اسمح بفتح النوافذ المنبثقة');return}w.document.open();w.document.write(makeExportHTML());w.document.close();if(printNow){w.onload=()=>setTimeout(()=>w.print(),250)}}async function issueInvoice(){const doctorId=state.reportFilters.doctorId;if(!doctorId){toast('اختر الطبيب أولًا');return}const from=state.reportFilters.from,to=state.reportFilters.to;let opening=0;if(state.settings.carryoverMode==='manual'){const v=prompt('أدخل الرصيد المرحّل من الفواتير السابقة لهذا الطبيب (اكتب 0 إذا لا يوجد)','0');if(v===null)return;opening=Number(v)||0}else{opening=autoOpeningBalance(doctorId,from)}const cases=state.cases.filter(c=>c.doctorId===doctorId&&(!from||c.receiveDate>=from)&&(!to||c.receiveDate<=to));const periodTotal=cases.reduce((s,c)=>s+caseTotals(c).total,0);const amounts=[];state.doctorPayments.filter(p=>p.doctorId===doctorId&&(!from||p.date>=from)&&(!to||p.date<=to)).forEach(p=>amounts.push(Number(p.amount||0)));cases.forEach(c=>(c.payments||[]).forEach(p=>{const date=p.date||c.receiveDate||'—';if((!from||date>=from)&&(!to||date<=to))amounts.push(Number(p.amount||0))}));const periodPaid=amounts.reduce((a,b)=>a+b,0);const closingDue=Math.max(0,opening+periodTotal-periodPaid);state.invoices.push({id:'inv_'+Date.now(),doctorId,from:from||'',to:to||'',issuedAt:new Date().toISOString(),openingBalance:opening,periodTotal,periodPaid,closingDue});await saveKey('invoices',state.invoices);toast('تم حفظ الفاتورة — رصيد '+fmt(closingDue)+' ج.م سيظهر تلقائيًا في الفاتورة القادمة')}

function nav(){return`<button id="nav-toggle" class="nav-toggle-btn" title="إخفاء/إظهار الشريط">${icon(state.navHidden?'chevronUp':'chevronDown')}</button><div class="bottom-nav ${state.navHidden?'nav-collapsed':''}">${[['cases','list','الحالات'],['doctors','doc','الأطباء والحسابات'],['prices','money','الأسعار'],['search','search','البحث'],['export','file','التصدير'],['settings','gear','الإعدادات']].map(x=>`<button class="nav-btn ${state.tab===x[0]?'active':''}" data-tab="${x[0]}"><span class="nav-icon-wrap">${icon(x[1])}</span><span>${x[2]}</span></button>`).join('')}</div>`}
function casesTab(){if(state.caseView==='form')return caseForm();if(state.statementDoctorId)return statementTab();let list=state.cases.slice().sort((a,b)=>b.createdAt-a.createdAt);let total=state.cases.reduce((s,c)=>s+caseTotals(c).total,0),casePaid=state.cases.reduce((s,c)=>s+caseTotals(c).paid,0),doctorPaid=state.doctorPayments.reduce((s,p)=>s+Number(p.amount||0),0),due=Math.max(0,total-casePaid-doctorPaid);return`<div class="panel"><button class="btn btn-primary" id="open-statement-picker">${icon('search')} البحث عن حالة</button>${state.statementPickerOpen?`<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>اختر الطبيب</th></tr></thead><tbody>${state.doctors.length?state.doctors.map(d=>`<tr><td data-pick-statement="${d.id}" style="cursor:pointer">${esc(d.name)}</td></tr>`).join(''):'<tr class="empty-row"><td>لا يوجد أطباء مسجلين</td></tr>'}</tbody></table></div>`:''}</div><div class="stat-lines"><div class="stat-line"><span>عدد الحالات</span><b>${state.cases.length}</b></div><div class="stat-line"><span>إجمالي المستحقات</span><b>${fmt(total)} ج.م</b></div><div class="stat-line"><span>المتبقي غير المحصل</span><b style="color:var(--danger)">${fmt(due)} ج.م</b></div></div><div class="panel"><div class="panel-head"><button class="btn btn-primary" id="new-case">${icon('plus')} حالة جديدة</button><div><h2>سجل الحالات</h2><div class="sub">كل الحالات المسجلة في المعمل</div></div></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>اسم الحالة</th><th>نوع الحالة</th><th>الكمية</th><th>اللون</th><th>سعر الوحدة</th><th>الإجمالي</th><th></th></tr></thead><tbody>${list.length?list.map(c=>(c.items&&c.items.length?c.items:[{}]).map((i,idx)=>{const type=state.priceList.find(p=>p.id===i.restorationId)?.name||'—';const lineTotal=(Number(i.qty)||0)*(Number(i.price)||0);return `<tr><td>${idx===0?(c.receiveDate||'—'):''}</td><td>${esc(i.itemName||'—')}</td><td>${esc(type)}</td><td>${fmt(i.qty||1)}</td><td>${esc(i.color||'—')}</td><td>${fmt(i.price||0) function showKeyboard(){if(!state.settings||!state.settings.customKeyboard)return;const el=ensureKeyboardEl();el.innerHTML=customKeyboardHTML();el.classList.add('show');wireKeyboard()}

document.addEventListener('focusin',e=>{const t=e.target;if(!state.settings||!state.settings.customKeyboard)return;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')){const excludedTypes=['number','date','password'];const isNumeric=t.getAttribute('inputmode')==='numeric';const excludedIds=['askpin-input','lock-pin'];if(!excludedTypes.includes(t.type)&&!isNumeric&&!excludedIds.includes(t.id)){kbTarget=t;try{t.setAttribute('inputmode','none')}catch(e){}showKeyboard()}}});

<script id="riad-calculator-v7-js">
(function(){
  function initCalculator(root){
    if(!root || root.dataset.calcReady) return;
    root.dataset.calcReady="1";
    const display=root.querySelector(".calc-display");
    if(!display) return;
    let expr="";
    const paint=()=>display.value=expr||"0";
    root.addEventListener("click",e=>{
      const b=e.target.closest("[data-calc]");
      if(!b) return;
      const v=b.dataset.calc;
      if(v==="C"){expr="";paint();return}
      if(v==="back"){expr=expr.slice(0,-1);paint();return}
      if(v==="="){
        try{
          if(!/^[0-9+\-*/().%\s]+$/.test(expr)) throw 0;
          let s=expr.replace(/%/g,"/100");
          let result=Function('"use strict";return ('+s+')')();
          if(!Number.isFinite(result)) throw 0;
          expr=String(Math.round(result*100000000)/100000000);
        }catch{expr="خطأ"}
        paint(); return;
      }
      if(expr==="خطأ") expr="";
      expr += v;
      paint();
    });
    paint();
  }
  window.initRiadCalculator=initCalculator;
  document.querySelectorAll(".calculator-panel").forEach(initCalculator);
})();
</script>
